<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f5132" />
    <meta name="description" content="Play the Filipino card game Tong-its with friends online." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tong-its" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Tong-its</title>
  </head>
  <body>
    <div id="app">
      <div style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px; color: #f4f1e8; background: #0f5132; min-height: 100vh">
        <h1>Tong-its</h1>
        <p>Loading…</p>
        <p style="font-size: 14px; opacity: 0.8">
          If this message stays, the app could not start. Open it from your Tong-its server's address
          (for example http://localhost:8080), or build it first with <code>npm run build</code> and open
          <code>packages/client/dist/index.html</code>.
        </p>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
